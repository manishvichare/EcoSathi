<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/ecosathi-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EcoSathi — AI-GIS Based Urban Green Cover Assessment and Environmental Health Platform" />
    <title>EcoSathi — AI-GIS Urban Environmental Platform</title>
    <script>
      // Global uncaught error listener to avoid blank white screen
      window.addEventListener('error', function(event) {
        var root = document.getElementById('root');
        if (!root || !root.hasChildNodes() || root.innerHTML.trim() === '') {
          var errDiv = document.getElementById('ecosathi-boot-error');
          if (!errDiv) {
            errDiv = document.createElement('div');
            errDiv.id = 'ecosathi-boot-error';
            errDiv.style = 'padding: 24px; margin: 24px auto; max-width: 600px; font-family: system-ui, sans-serif; background: #fff1f2; border: 1px solid #fecdd3; border-radius: 16px; color: #9f1239;';
            document.body.appendChild(errDiv);
          }
          errDiv.innerHTML = '<h3 style="margin:0 0 8px 0;font-size:16px;">⚠️ Startup Error Detected</h3><p style="margin:0 0 12px 0;font-size:13px;font-weight:bold;">' + (event.message || event.error) + '</p><button onclick="localStorage.clear();sessionStorage.clear();location.reload();" style="padding:8px 16px;background:#059669;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:12px;">Clear Cache & Refresh</button>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
