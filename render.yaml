services:
  - type: web
    name: ecosathi
    runtime: node
    plan: free
    # Vite is a frontend devDependency but is required while building the
    # production bundle. Explicitly include dev dependencies during this step.
    buildCommand: npm ci --include=dev --prefix frontend && npm run build --prefix frontend && npm ci --prefix Backend
    startCommand: npm start --prefix Backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: WAQI_API_TOKEN
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Optional but required for the AI-powered routes. This runs separately
  # because Render services have one runtime and this component is Python.
  - type: web
    name: ecosathi-ai
    runtime: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BACKEND_ORIGIN
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.6-27b
